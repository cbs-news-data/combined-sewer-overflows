<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.5.0/dist/maplibre-gl.css" />
<script src="https://unpkg.com/maplibre-gl@4.5.0/dist/maplibre-gl.js"></script>
<script type="text/javascript" src="https://pym.nprapps.org/pym.v1.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@2.3.0/dist/maplibre-gl.css" />

<!-- Fonts -->
<link rel="stylesheet" href="https://use.typekit.net/rdn8fde.css" />
<style>
    @font-face {
        font-family: "Publico Headline";
        src: url("fonts/PublicoHeadline-Black.woff2") format("woff2"),
            url("fonts/PublicoHeadline-Black.woff") format("woff");
    }


    body {
        margin: 0 !important;
    }

    a {
        text-decoration: underline;
        text-decoration-color: #A5091E;
        color: #858585;
    }

    a:hover {
        cursor: pointer;
        color: #A5091E
    }

    a#source {
        color: #858585;
        text-decoration: none;
    }

    #container {
        display: flex;
        flex-direction: column;
        height: 100vh;
    }

    #header {
        z-index: 1;
        max-width: 980px;
    }

    .title {
        font-family: "Publico Headline", serif;
        line-height: 34px;
        font-size: 32px;
        color: rgb(0, 0, 0);
    }

    .description {
        font-family: "proxima-nova", sans-serif;
        font-size: 16px;
        line-height: 1.3;
        max-width: 980px;
        margin-top: 12px;
    }

    .legend {
        display: flex;
        align-items: center;
        font-family: "proxima-nova", sans-serif;
        font-size: 14px;
        margin-bottom: 5px;
    }

    span.legend-title {
        font-size: 16px;
        font-family: "proxima-nova", sans-serif;
    }

    .legend div {
        width: 15px;
        height: 15px;
        margin-right: 5px;
        border-radius: 2px;
    }

    .legend span {
        margin-right: 5px;
        font-family: "proxima-nova", sans-serif;
    }

    .active {
        background-color: #5ca8ad;
        /* margin-left: 15px; */
    }

    .recent {
        background-color: #636363;
        /* margin-left: 15px; */
    }

    #map {
        flex-grow: 1;
        max-height: 700px;
        max-width: 980px;
        margin-bottom: 12px;
    }

    button.maplibregl-ctrl-compass {
        display: none !important;
    }


    /* MEDIA QUERY */
    @media (max-width: 430px) {
        #map {
            max-height: 900px !important;
        }

        .description {
            margin-bottom: 10px;
        }

        .legend {
            display: flex;
            align-items: center;
            font-family: "proxima-nova", sans-serif;
            font-size: 14px;
            margin-bottom: 5px;
        }

        span.legend-title {
            font-size: 14px;
            font-family: "proxima-nova", sans-serif;
        }

        .legend div {
            width: 15px;
            height: 15px;
            margin-right: 4px;
            border-radius: 2px;
        }

        .legend span {
            font-family: "proxima-nova", sans-serif;
        }

        .none {
            background-color: #cccccc;
            /* margin-left: 10px; */
        }
    }

    .note {
        font-family: "proxima-nova", sans-serif;
        font-size: 16px;
    }

    .source {
        font-family: "proxima-nova", sans-serif;
        color: rgb(130, 130, 130);
        font-size: 14px;
    }
</style>

<div id="container">
    <div id="header">
        <div class="title">CSO outfall locations in the U.S.</div>
        <p class="description">The map below shows the locations of CSO outfalls in the U.S. If they are in areas shaded in blue, they are in a disadvantaged Census Tract. Hover or click on a CSO outfall location to get the coordinates.</p>
        <div class="legend">
            <div class="active"></div>
            <span>Disadvantaged</span>
        </div>
    </div>
    <div id="map"></div>
    <div class="note"></div>
    <!-- <div class="source">
    Map: Taylor Johnston and John Kelly / CBS News •
    Source:
    <a href="https://www.fire.ca.gov/" target="_blank" id="source">Cal Fire</a>
  </div> -->
</div>

<script>
    const map = new maplibregl.Map({
        container: "map",
        style: "https://raw.githubusercontent.com/go2garret/maps/main/src/assets/json/openStreetMap.json",
        center: [-98, 36],
        zoom: 3.7,
    });

    map.scrollZoom.disable();
    map.addControl(new maplibregl.NavigationControl(), "top-left");

    map.on("load", () => {
        map.addSource("points", {
            type: "geojson",
            data: "data/cso-locations.geojson",
            generateId: true,
        });

        map.addLayer({
            id: "points-layer",
            type: "circle",
            source: "points",
            paint: {
                "circle-color": "black",
                "circle-radius": 3,
                "circle-opacity": 0.8,
            },
        });

        // Add shapefile source
        map.addSource("shapefile", {
            type: "geojson",
            data: "data/NEW_J40.geojson",
            generateId: true,
        });

        // Add shapefile fill layer
        map.addLayer({
            id: "shapefile-layer",
            type: "fill",
            source: "shapefile",
            paint: {
                "fill-color": "#5ca8ad",
                "fill-opacity": 0.5,
            },
        });

        // Add shapefile outline layer
        map.addLayer({
            id: "shapefile-layer-outline",
            type: "line",
            source: "shapefile",
            paint: {
                "line-color": "#347f85",
                "line-width": 1,
            },
        });

        // Move points above shapefile
        map.moveLayer("points-layer");
    });



    let hoveredFeatureId = null;


    const popup = new maplibregl.Popup({ closeButton: false, closeOnClick: false });

map.on("click", "points-layer", (e) => {
    if (e.features.length > 0) {
        const feature = e.features[0];
        const LAT = feature.properties.PF_LAT;
        const LON = feature.properties.PF_LON;

        // Create content with a close button
        const popupContent = document.createElement("div");
        popupContent.style.fontSize = "14px";
        popupContent.style.position = "relative";
        popupContent.innerHTML = `
            <button id="close-btn" style="
                position: absolute;
                top: -20px;
                right: 5px;
                padding: 2px 5px;
                font-size: 12px;
                border: none;
                color: black;
                cursor: pointer;
            "></button>
            <strong>CSO outfall coordinates:</strong><br>
            <a href="https://www.google.com/maps?q=${LAT},${LON}" target="_blank">
                ${LAT}, ${LON}
            </a>
        `;

        // Attach close button event
        popupContent.querySelector("#close-btn").onclick = () => popup.remove();

        popup.setLngLat(e.lngLat).setDOMContent(popupContent).addTo(map);
    }
});

// Change cursor to pointer when hovering over points
map.on("mouseenter", "points-layer", () => {
    map.getCanvas().style.cursor = "pointer";
});

map.on("mouseleave", "points-layer", () => {
    map.getCanvas().style.cursor = "";
});
    document.addEventListener("DOMContentLoaded", function () {
        var pymChild = new pym.Child();
        pymChild.sendHeight();
    });
</script>
